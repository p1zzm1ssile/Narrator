name: Test, build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/p1zzm1ssile/narrator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python packages (the voice models aren't needed for the tests)
        run: pip install fastapi uvicorn python-multipart requests soundfile numpy librosa httpx pytest
      - name: Run tests (a whole story through the API to an M4B and MP3, with a stand-in voice)
        run: python -m pytest -q tests

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make room for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Read version
        id: version
        run: echo "version=$(awk -F\" '/__version__/ {print $2}' src/main.py | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: narrator:test

      - name: Check the image starts and the web UI answers
        run: |
          docker run --rm narrator:test sh -c "ffmpeg -version | head -1 && python3 -c 'import torch, chatterbox.tts, faster_whisper, main; print(\"Narrator loads, torch\", torch.__version__)'"
          docker run -d --name smoke -p 9895:9895 narrator:test
          for i in $(seq 60); do curl -sf http://localhost:9895/api/health && break || sleep 1; done
          curl -sf http://localhost:9895/ | grep -q "<title>Narrator</title>"
          curl -sf http://localhost:9895/api/voices | grep -q chatterbox:default
          docker logs smoke
          docker rm -f smoke

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
